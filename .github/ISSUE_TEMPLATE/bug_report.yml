name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach credentials or raw Codex session files. Sanitize usernames, paths, thread IDs, prompts, and responses."
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.x"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Mac model
      placeholder: "13-inch MacBook Pro with Touch Bar"
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex Desktop version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
