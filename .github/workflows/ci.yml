name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Build release configuration
        run: swift build -c release
      - name: Package and verify app
        run: |
          bash scripts/build-app.sh
          bash scripts/verify-app.sh
      - name: Check packaged doctor command
        run: |
          python3 - <<'PY'
          import json, plistlib, subprocess
          from pathlib import Path
          app = Path("dist/RehireBar.app/Contents")
          metadata = plistlib.loads((app / "Info.plist").read_bytes())
          result = subprocess.run(
              [str(app / "MacOS/RehireBar"), "doctor", "--json"],
              capture_output=True, check=True, timeout=10,
          )
          report = json.loads(result.stdout)
          assert report["schemaVersion"] == 1
          assert report["app"]["version"] == metadata["CFBundleShortVersionString"]
          assert report["app"]["build"] == metadata["CFBundleVersion"]
          assert report["runtimeProbe"] == "not-run"
          assert report["navigation"]["taskOpening"] == "not-tested"
          PY
      - name: Package Apple silicon and Intel releases
        run: bash scripts/build-release.sh
