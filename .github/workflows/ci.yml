name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test
      - name: Build release configuration
        run: swift build -c release
      - name: Package and verify app
        run: |
          bash scripts/build-app.sh
          bash scripts/verify-app.sh
      - name: Package Apple silicon and Intel releases
        run: bash scripts/build-release.sh
      - name: Check native release archive
        run: |
          python3 - <<'PY'
          import json, platform, plistlib, subprocess, tempfile
          from pathlib import Path
          metadata = plistlib.loads(Path("Resources/Info.plist").read_bytes())
          version = metadata["CFBundleShortVersionString"]
          architecture = platform.machine()
          archive = Path("release") / f"RehireBar-{version}-macos-{architecture}.zip"
          with tempfile.TemporaryDirectory() as directory:
              subprocess.run(["ditto", "-x", "-k", str(archive), directory], check=True)
              app = Path(directory) / "RehireBar.app/Contents"
              result = subprocess.run(
                  [str(app / "MacOS/RehireBar"), "doctor", "--json"],
                  capture_output=True, check=True, timeout=10,
              )
              report = json.loads(result.stdout)
              assert report["schemaVersion"] == 1
              assert report["app"]["version"] == version
              assert report["app"]["build"] == metadata["CFBundleVersion"]
              assert report["host"]["processArchitecture"] == architecture
              assert report["runtimeProbe"] == "not-run"
              assert report["navigation"]["taskOpening"] == "not-tested"
          PY
      - name: Retain verified release archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.runner }}
          path: |
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
